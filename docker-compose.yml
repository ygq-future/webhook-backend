# 这是“源码目录的上一级目录”用的 compose 模板。
# 目录结构示例：
#   parent/
#   ├─ docker-compose.yml
#   └─ webhook-backend/
#      ├─ Dockerfile
#      ├─ .env
#      └─ data/
#
# 在 parent 目录执行：docker compose up -d --build
services:
  webhook-backend:
    build:
      context: ./webhook-backend
      dockerfile: Dockerfile
    image: webhook-backend:latest
    container_name: webhook-backend
    restart: unless-stopped
    env_file:
      - ./webhook-backend/.env
    ports:
      - '3000:3000'
    volumes:
      - ./webhook-backend/data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
